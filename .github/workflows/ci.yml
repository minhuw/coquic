name: Per-Commit CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  steward-tests:
    name: Steward Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          summarize: false

      - name: Check Steward dependency lock
        run: nix develop -c uv lock --check --project steward

      - name: Test Steward suite
        run: nix develop -c bash -c 'command -v ssh && uv run --locked --project steward python -m pytest steward/tests -q'

      - name: Smoke Steward CLI load
        run: nix develop -c env -u VIRTUAL_ENV PYTHONNOUSERSITE=1 PYTHONPATH=steward/src python -c 'from coquic_steward.cli import app; assert app is not None'

  steward-container-smoke:
    name: Steward Production Container Boundary
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          summarize: false

      - name: Build pinned images and run the full offline validation baseline
        run: nix develop -c bash steward/containers/smoke-test.sh --images --full-validation

      - name: Exercise real task isolation and cancellation
        run: nix develop -c bash steward/containers/smoke-test.sh --isolation --shutdown

      - name: Exercise production-identity provisioning and candidate rejection
        run: nix develop -c bash steward/containers/production-canary.sh

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          summarize: false

      - name: Format Check
        run: nix develop -c pre-commit run clang-format --all-files --show-diff-on-failure

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          summarize: false

      - name: Lint
        env:
          COQUIC_CLANG_TIDY_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COQUIC_CLANG_TIDY_DIFF_HEAD: ${{ github.sha }}
        run: |
          if [ "${COQUIC_CLANG_TIDY_DIFF_BASE}" = "0000000000000000000000000000000000000000" ]; then
            COQUIC_CLANG_TIDY_DIFF_BASE="$(git rev-parse HEAD^)"
            export COQUIC_CLANG_TIDY_DIFF_BASE
          fi
          nix develop .#lint -c ./scripts/run-clang-tidy.sh --diff

  compliance:
    name: RFC Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          summarize: false

      - name: Duvet Report
        run: nix develop -c ./scripts/compliance --ci

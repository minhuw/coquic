name: Deploy Demo

concurrency:
  group: deploy-demo
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - site-v2/**
      - site/deploy/**
      - src/**
      - build.zig
      - build.zig.zon
      - flake.nix
      - flake.lock
      - .github/workflows/deploy-demo.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-demo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preflight demo SSH port
        run: |
          remote_host="coquic.minhuw.dev"
          remote_port="22"
          for attempt in $(seq 1 6); do
            if timeout 10s bash -c ":</dev/tcp/${remote_host}/${remote_port}"; then
              exit 0
            fi
            if [[ "${attempt}" == "6" ]]; then
              echo "remote SSH port preflight failed after 6 attempts: ${remote_host}:${remote_port}" >&2
              exit 1
            fi
            echo "remote SSH port preflight attempt ${attempt}/6 failed; retrying in 10s" >&2
            sleep 10
          done

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@92148bb48b9a0c5458c53dd0b368fbfbfbaa3210
        with:
          summarize: false

      - name: Build h3-server
        run: nix develop .#quictls-musl -c zig build -Dtls_backend=quictls -Dtarget=x86_64-linux-musl -Dspdlog_shared=false

      - name: Build Next.js V2 demo
        run: |
          nix develop -c npm --prefix site-v2 ci
          nix develop -c uv run --project site-v2 python site-v2/scripts/validate_contracts.py
          nix develop -c npm --prefix site-v2 run test:unit
          nix develop -c npm --prefix site-v2 run typecheck
          nix develop -c npm --prefix site-v2 run build

      - name: Package V2 demo app
        run: |
          app_dir="${RUNNER_TEMP}/demo-app"
          rm -rf -- "${app_dir}"
          install -d -m 755 "${app_dir}/.next"
          cp -R -- site-v2/.next/standalone/. "${app_dir}/"
          cp -R -- site-v2/.next/static "${app_dir}/.next/static"
          if [[ -d site-v2/public ]]; then
            cp -R -- site-v2/public "${app_dir}/public"
          fi
          test -f "${app_dir}/server.js"

      - name: Configure SSH
        env:
          COQUIC_DEMO_REMOTE_SSH_KEY: ${{ secrets.COQUIC_DEMO_REMOTE_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "${COQUIC_DEMO_REMOTE_SSH_KEY}" > "${RUNNER_TEMP}/coquic-demo.key"
          cat > "${HOME}/.ssh/known_hosts" <<'EOF'
          coquic.minhuw.dev ssh-rsa 
          coquic.minhuw.dev ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCjTT5KdjyCQ3G04Z8mUUOkXAqsdDuU4K5bB3jXi5B3aIzYK+2f0TT0XE3G0/r/KmZoSHYxb21TtjykFa47XFSA=
          coquic.minhuw.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILi5VjtrGcYlzyYEXd4/PzQJXBjZ028DA6nJ7Xu50CJh
          EOF
          chmod 600 "${RUNNER_TEMP}/coquic-demo.key" "${HOME}/.ssh/known_hosts"

      - name: Preflight demo SSH
        run: |
          remote_target="minhuw@coquic.minhuw.dev"
          ssh_opts=(
            -p 22
            -i "${RUNNER_TEMP}/coquic-demo.key"
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o ConnectionAttempts=3
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts"
          )
          for attempt in $(seq 1 6); do
            if ssh "${ssh_opts[@]}" "${remote_target}" true; then
              exit 0
            fi
            if [[ "${attempt}" == "6" ]]; then
              echo "remote SSH preflight failed after 6 attempts: ${remote_target}:22" >&2
              exit 1
            fi
            echo "remote SSH preflight attempt ${attempt}/6 failed; retrying in 10s" >&2
            sleep 10
          done

      - name: Deploy demo
        env:
          COQUIC_DEMO_CERT_CHAIN_PEM: ${{ secrets.COQUIC_DEMO_CERT_CHAIN_PEM }}
          COQUIC_DEMO_PRIVATE_KEY_PEM: ${{ secrets.COQUIC_DEMO_PRIVATE_KEY_PEM }}
          COQUIC_DEMO_QA_ENABLED: "false"
          COQUIC_DEMO_VERIFICATION_PATH: /preview
          COQUIC_DEMO_PAGE_MARKER: CoQUIC V2 is under construction
          COQUIC_DEMO_VERIFY_WASM: "false"
          COQUIC_V2_PREVIEW_PASSWORD: happyquic
        run: site/deploy/deploy-remote.sh "$(pwd)/zig-out/bin/h3-server" "${RUNNER_TEMP}/demo-app"

      - name: Check deployed V2 preview
        run: |
          headers="$(curl --fail --silent --show-error --head https://coquic.minhuw.dev/)"
          grep -Eiq '^location:.*\/preview' <<<"${headers}"
          page="$(curl --fail --silent --show-error https://coquic.minhuw.dev/preview)"
          grep -Fq 'CoQUIC V2 is under construction' <<<"${page}"
          curl --fail --silent --show-error \
            --cookie-jar "${RUNNER_TEMP}/v2-preview.cookies" \
            --output /dev/null \
            --data-urlencode 'password=happyquic' \
            --data-urlencode 'next=/' \
            https://coquic.minhuw.dev/api/preview-access
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --cookie "${RUNNER_TEMP}/v2-preview.cookies" \
            https://coquic.minhuw.dev/)"
          test "${status}" = "200"
          archive_status="$(curl --fail --silent --show-error \
            --cookie "${RUNNER_TEMP}/v2-preview.cookies" \
            https://coquic.minhuw.dev/api/steward/status)"
          grep -Eq '"state":"(indexing|ready|degraded|unavailable|incompatible|archive-corrupt)"' <<<"${archive_status}"

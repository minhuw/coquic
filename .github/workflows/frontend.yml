name: Frontend

on:
  pull_request:
    paths:
      - 'site/next/**'
      - 'site-v2/**'
      - 'flake.nix'
      - 'DESIGN.md'
      - '.github/workflows/frontend.yml'
  push:
    paths:
      - 'site/next/**'
      - 'site-v2/**'
      - 'flake.nix'
      - 'DESIGN.md'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          summarize: false

      - name: Install frontend dependencies
        run: nix develop -c npm --prefix site/next ci

      - name: Install Playwright Chromium
        run: nix develop -c npm --prefix site/next exec -- playwright install --with-deps chromium

      - name: Lint
        run: nix develop -c npm --prefix site/next run lint

      - name: Style boundary
        run: nix develop -c npm --prefix site/next run check:styles

      - name: Typecheck
        run: nix develop -c npm --prefix site/next run typecheck

      - name: Unit tests
        run: nix develop -c npm --prefix site/next run test

      - name: Production build
        run: nix develop -c npm --prefix site/next run build

      - name: Visual smoke
        env:
          COQUIC_PLAYWRIGHT_PORT: 3204
          COQUIC_PLAYWRIGHT_FIXTURE_ROOT: /tmp/coquic-steward-playwright-ci
        run: nix develop -c npm --prefix site/next run test:e2e -- tests/e2e/visual-foundation.spec.ts --project=desktop

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-artifacts
          if-no-files-found: ignore
          path: |
            site/next/test-results/**
            site/next/playwright-report/**

  site-v2-quality:
    name: Site V2 cloud publication quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          summarize: false
      - name: Install Site V2 dependencies
        run: nix develop -c npm --prefix site-v2 ci
      - name: Install Site V2 Playwright Chromium
        run: nix develop -c npm --prefix site-v2 exec -- playwright install --with-deps chromium
      - name: Contract validation
        run: nix develop -c uv run --project site-v2 python site-v2/scripts/validate_contracts.py
      - name: Cloud publication unit tests
        run: nix develop -c npm --prefix site-v2 run test:unit
      - name: Typecheck and build
        run: |
          nix develop -c npm --prefix site-v2 run typecheck
          nix develop -c npm --prefix site-v2 run build
      - name: Steward cloud publication smoke
        run: nix develop -c npm --prefix site-v2 run test:steward
      - name: Steward trajectory browser proof
        run: nix develop -c npm --prefix site-v2 run test:visual -- tests/steward.spec.ts --workers=1
      - name: Upload Site V2 Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-v2-playwright-artifacts
          if-no-files-found: ignore
          path: |
            site-v2/test-results/**
            site-v2/playwright-report/**
      - name: Deployment path smoke
        run: nix develop -c npm --prefix site-v2 run test:deploy

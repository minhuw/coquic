name: Steward Synthetic Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  STEWARD_MONITOR_BASE_URL: https://coquic.minhuw.dev

jobs:
  monitor:
    name: Check deployed Steward contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f
        with:
          summarize: false

      - name: Run read-only synthetic check
        run: |
          mkdir -p "${RUNNER_TEMP}/steward-monitor"
          nix develop -c uv run --project steward python scripts/check-steward-deployment.py \
            --base-url "${STEWARD_MONITOR_BASE_URL}" \
            --max-age-seconds 120 \
            --max-latency-ms 2000 \
            --output "${RUNNER_TEMP}/steward-monitor/result.json"

      - name: Upload Steward monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steward-synthetic-monitor-${{ github.run_id }}
          path: ${{ runner.temp }}/steward-monitor/result.json
          if-no-files-found: warn

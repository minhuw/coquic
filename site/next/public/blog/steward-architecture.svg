<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 880" font-family="'Inter','Segoe UI',system-ui,sans-serif" role="img" aria-label="Steward pipeline: signals flow through a planner and verifier into a sandboxed worker, then validation, review, and gated integration to main">
  <rect width="1720" height="880" fill="#faf7f0"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f3d8f"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d98a1f"/>
    </marker>
  </defs>

  <!-- Signals -->
  <rect x="50" y="250" width="300" height="280" rx="18" fill="#ffffff" stroke="#3f3d8f" stroke-width="3"/>
  <text x="200" y="300" text-anchor="middle" font-size="34" font-weight="700" fill="#2a2947">Signals</text>
  <g>
    <rect x="80" y="330" width="240" height="52" rx="10" fill="#eef0fb"/>
    <path d="M104 372 L118 346 L132 372 Z" fill="none" stroke="#d98a1f" stroke-width="4" stroke-linejoin="round"/>
    <text x="150" y="366" font-size="24" fill="#2a2947">CI failure</text>
  </g>
  <g>
    <rect x="80" y="394" width="240" height="52" rx="10" fill="#eef0fb"/>
    <circle cx="118" cy="420" r="12" fill="none" stroke="#3f3d8f" stroke-width="4"/>
    <line x1="106" y1="408" x2="98" y2="400" stroke="#3f3d8f" stroke-width="4" stroke-linecap="round"/>
    <line x1="130" y1="408" x2="138" y2="400" stroke="#3f3d8f" stroke-width="4" stroke-linecap="round"/>
    <line x1="106" y1="432" x2="98" y2="440" stroke="#3f3d8f" stroke-width="4" stroke-linecap="round"/>
    <line x1="130" y1="432" x2="138" y2="440" stroke="#3f3d8f" stroke-width="4" stroke-linecap="round"/>
    <text x="150" y="430" font-size="24" fill="#2a2947">Alert</text>
  </g>
  <g>
    <rect x="80" y="458" width="240" height="52" rx="10" fill="#eef0fb"/>
    <rect x="104" y="470" width="28" height="30" rx="5" fill="none" stroke="#3f3d8f" stroke-width="4"/>
    <line x1="110" y1="480" x2="126" y2="480" stroke="#3f3d8f" stroke-width="3" stroke-linecap="round"/>
    <line x1="110" y1="490" x2="122" y2="490" stroke="#3f3d8f" stroke-width="3" stroke-linecap="round"/>
    <text x="150" y="494" font-size="24" fill="#2a2947">Issue</text>
  </g>

  <line x1="350" y1="390" x2="425" y2="390" stroke="#3f3d8f" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Planner + Verifier -->
  <rect x="435" y="290" width="230" height="180" rx="18" fill="#ffffff" stroke="#3f3d8f" stroke-width="3"/>
  <text x="550" y="365" text-anchor="middle" font-size="34" font-weight="700" fill="#2a2947">Planner</text>
  <text x="550" y="405" text-anchor="middle" font-size="22" fill="#6b6a8a">proposes tasks</text>
  <line x1="550" y1="470" x2="550" y2="510" stroke="#3f3d8f" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="450" y="516" width="200" height="66" rx="14" fill="#fdf3e2" stroke="#d98a1f" stroke-width="3"/>
  <path d="M486 532 l14 6 v12 c0 10 -6 16 -14 20 c-8 -4 -14 -10 -14 -20 v-12 z" fill="none" stroke="#d98a1f" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="565" y="558" text-anchor="middle" font-size="26" font-weight="600" fill="#8a5a10">Verifier</text>

  <line x1="665" y1="390" x2="740" y2="390" stroke="#3f3d8f" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Worker sandbox -->
  <rect x="750" y="245" width="290" height="310" rx="20" fill="none" stroke="#6b6a8a" stroke-width="3" stroke-dasharray="12 10"/>
  <rect x="782" y="300" width="226" height="160" rx="16" fill="#ffffff" stroke="#3f3d8f" stroke-width="3"/>
  <rect x="866" y="326" width="58" height="46" rx="10" fill="none" stroke="#3f3d8f" stroke-width="4"/>
  <circle cx="884" cy="349" r="4.5" fill="#3f3d8f"/>
  <circle cx="906" cy="349" r="4.5" fill="#3f3d8f"/>
  <line x1="895" y1="326" x2="895" y2="312" stroke="#3f3d8f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="895" cy="308" r="4" fill="#d98a1f"/>
  <text x="895" y="424" text-anchor="middle" font-size="34" font-weight="700" fill="#2a2947">Worker</text>
  <text x="895" y="534" text-anchor="middle" font-size="22" fill="#6b6a8a">sandboxed worktree</text>

  <line x1="1040" y1="390" x2="1115" y2="390" stroke="#3f3d8f" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Validation / Review -->
  <rect x="1125" y="255" width="240" height="115" rx="16" fill="#ffffff" stroke="#3f3d8f" stroke-width="3"/>
  <text x="1245" y="322" text-anchor="middle" font-size="32" font-weight="700" fill="#2a2947">Validation</text>
  <line x1="1245" y1="370" x2="1245" y2="415" stroke="#3f3d8f" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1125" y="425" width="240" height="115" rx="16" fill="#ffffff" stroke="#3f3d8f" stroke-width="3"/>
  <text x="1245" y="492" text-anchor="middle" font-size="32" font-weight="700" fill="#2a2947">Review</text>

  <!-- revise loop -->
  <path d="M1125 500 C 1010 590, 940 600, 902 566" fill="none" stroke="#d98a1f" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowAmber)"/>
  <text x="1014" y="628" text-anchor="middle" font-size="24" font-style="italic" fill="#8a5a10">revise</text>

  <line x1="1365" y1="390" x2="1440" y2="390" stroke="#3f3d8f" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Integration -->
  <rect x="1450" y="300" width="220" height="180" rx="18" fill="#2b2a6b"/>
  <rect x="1538" y="352" width="44" height="36" rx="8" fill="none" stroke="#f2c063" stroke-width="4"/>
  <path d="M1546 352 v-10 a14 14 0 0 1 28 0 v10" fill="none" stroke="#f2c063" stroke-width="4"/>
  <text x="1560" y="440" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">Integration</text>

  <!-- to main -->
  <line x1="1560" y1="480" x2="1560" y2="600" stroke="#3f3d8f" stroke-width="4" marker-end="url(#arrow)"/>
  <g>
    <circle cx="1470" cy="660" r="12" fill="none" stroke="#3f3d8f" stroke-width="4"/>
    <line x1="1482" y1="660" x2="1620" y2="660" stroke="#3f3d8f" stroke-width="4"/>
    <circle cx="1560" cy="660" r="12" fill="#d98a1f" stroke="#d98a1f"/>
    <circle cx="1632" cy="660" r="12" fill="none" stroke="#3f3d8f" stroke-width="4"/>
    <text x="1560" y="714" text-anchor="middle" font-size="28" font-weight="600" fill="#2a2947">main</text>
  </g>

  <!-- caption -->
  <text x="860" y="806" text-anchor="middle" font-size="24" fill="#6b6a8a">Steward: evidence in, gated commits out. Only Integration may touch main.</text>
</svg>

# Synthetic fixture only. Production uses compose.yml and the checked-in
# management command. Values here are intentionally fake and non-secret.
services:
  steward:
    image: fake-steward-daemon@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    init: true
    user: "1000:1000"
    group_add: ["999"]
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 128m
    tmpfs:
      - "/tmp:rw,noexec,nosuid,nodev,size=16m"
      - "/run:rw,noexec,nosuid,nodev,size=4m"
    volumes:
      - type: bind
        source: /tmp/fake-coquic-home
        target: /tmp/fake-coquic-home
        read_only: false
      - type: bind
        source: /tmp/fake-docker.sock
        target: /tmp/fake-docker.sock
    secrets:
      - source: codex
        target: /run/secrets/codex-api
      - source: github
        target: /run/secrets/github-identity
      - source: dataset
        target: /run/secrets/dataset-identity

secrets:
  codex:
    file: /tmp/fake-codex
  github:
    file: /tmp/fake-github
  dataset:
    file: /tmp/fake-dataset

name: ${STEWARD_COMPOSE_PROJECT:?set STEWARD_COMPOSE_PROJECT}

services:
  steward:
    image: ${STEWARD_DAEMON_IMAGE:?set verified daemon image identity}
    init: true
    user: "${STEWARD_UID:?}:${STEWARD_GID:?}"
    group_add:
      - "${STEWARD_DOCKER_GID:?}"
    restart: unless-stopped
    stop_grace_period: ${STEWARD_STOP_GRACE:?}s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: ${STEWARD_MAX_PIDS:?}
    mem_limit: ${STEWARD_MAX_MEMORY:?}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${STEWARD_MAX_SCRATCH_BYTES:?}
      - /run:rw,noexec,nosuid,nodev,size=16m
    logging:
      driver: local
      options:
        max-size: ${STEWARD_MAX_LOG_BYTES:?}b
        max-file: "3"
    labels:
      coquic.steward.owner: steward
      coquic.steward.deployment: ${STEWARD_COMPOSE_PROJECT:?}
      coquic.steward.runtime: daemon-compose-v1
      coquic.steward.release: ${STEWARD_RELEASE_ID:?}
    environment:
      COQUIC_HOME: ${COQUIC_HOME:?}
      COQUIC_REPOSITORY: ${COQUIC_REPOSITORY:?}
      DOCKER_SOCKET: ${DOCKER_SOCKET:?}
      STEWARD_UID: ${STEWARD_UID:?}
      STEWARD_GID: ${STEWARD_GID:?}
      STEWARD_DOCKER_GID: ${STEWARD_DOCKER_GID:?}
      STEWARD_CONFIG_PATH: ${STEWARD_CONFIG_PATH:?}
      STEWARD_RELEASE_ID: ${STEWARD_RELEASE_ID:?}
      STEWARD_DAEMON_IMAGE: ${STEWARD_DAEMON_IMAGE:?}
      STEWARD_TASK_IMAGE: ${STEWARD_TASK_IMAGE:?}
      STEWARD_VALIDATION_IMAGE: ${STEWARD_VALIDATION_IMAGE:?}
      STEWARD_STOP_GRACE: ${STEWARD_STOP_GRACE:?}
      STEWARD_MIN_FREE_BYTES: ${STEWARD_MIN_FREE_BYTES:?}
      STEWARD_MAX_OWNED_DOCKER_BYTES: ${STEWARD_MAX_OWNED_DOCKER_BYTES:?}
      STEWARD_RECOVERY_FREE_BYTES: ${STEWARD_RECOVERY_FREE_BYTES:?}
      STEWARD_RECOVERY_OWNED_DOCKER_BYTES: ${STEWARD_RECOVERY_OWNED_DOCKER_BYTES:?}
    volumes:
      - type: bind
        source: ${COQUIC_HOME:?}
        target: ${COQUIC_HOME:?}
        read_only: false
      - type: bind
        source: ${DOCKER_SOCKET:?}
        target: ${DOCKER_SOCKET:?}
        read_only: false
      - type: bind
        source: ${STEWARD_CONFIG_PATH:?}
        target: /etc/coquic-steward/steward.toml
        read_only: true
      - type: bind
        source: ${COQUIC_HOME:?}/private/runtime/daemon-passwd
        target: /etc/passwd
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COQUIC_HOME:?}/private/runtime/daemon-group
        target: /etc/group
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - source: d1_token
        target: /run/secrets/d1-read-token
        uid: "${STEWARD_UID:?}"
        gid: "${STEWARD_GID:?}"
        mode: 0400
      - source: r2_access_key_id
        target: /run/secrets/r2-access-key-id
        uid: "${STEWARD_UID:?}"
        gid: "${STEWARD_GID:?}"
        mode: 0400
      - source: r2_secret_access_key
        target: /run/secrets/r2-secret-access-key
        uid: "${STEWARD_UID:?}"
        gid: "${STEWARD_GID:?}"
        mode: 0400
      - source: live_snapshot_token
        target: /run/secrets/live-write-token
        uid: "${STEWARD_UID:?}"
        gid: "${STEWARD_GID:?}"
        mode: 0400
    healthcheck:
      test: ["CMD", "/usr/bin/env", "coquic-steward", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  d1_token:
    file: ${D1_TOKEN_PATH:?}
  r2_access_key_id:
    file: ${R2_ACCESS_KEY_ID_PATH:?}
  r2_secret_access_key:
    file: ${R2_SECRET_ACCESS_KEY_PATH:?}
  live_snapshot_token:
    file: ${LIVE_SNAPSHOT_TOKEN_PATH:?}

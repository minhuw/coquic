[steward]
# The daemon checks SQLite for CLI wakeups at this interval. Signal polling
# intervals are configured per provider below.
scheduler_wait_interval_sec = 1.0
codex_bin = "codex"
# codex_model = "gpt-5.6-terra"
# codex_reasoning_effort = "medium"
codex_sandbox = "workspace-write"
# Local Codex execution is test-only and must be selected explicitly.
local_codex_test_harness = true
daemon_image = "coquic-steward-daemon"
# daemon_image_digest = "sha256:<64 lowercase hex characters>"
validation_image = "coquic-steward-validation"
# validation_image_digest = "sha256:<64 lowercase hex characters>"
runtime_protocol = "task-container-v1"
# Startup is fail-closed. Restart Steward after changing this setting.
dry_run = true
shutdown_grace_seconds = 30
# Resume launch attempts are deliberately fixed at two; ordinary role changes
# always allocate a fresh session.
git_remote = "origin"
main_branch = "main"
github_repository = "minhuw/coquic"

# Task containers are disabled by default for local planning fixtures. When
# enabled, every path is host-local and the image must be locked by digest.
[steward.container]
enabled = false
image = "coquic-steward-task"
# image_digest = "sha256:<64 lowercase hex characters>"
# repository_host_path = "/srv/coquic"
# state_host_path = "/srv/coquic-steward"
# codex_api_key_path = "/run/secrets/codex-api-key"
docker_bin = "docker"
network = "bridge"

# Cloud publication is daemon-only and disabled for local fixtures. The
# identifiers, bucket names, URL, and paths below are fake non-secret examples;
# enabling publication requires existing private credential files and staging.
[steward.publication]
enabled = false
account_id = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
d1_database_id = "12345678-1234-4abc-8def-1234567890ab"
d1_token_path = "/tmp/fake-coquic-home/private/credentials/d1-read-token"
r2_endpoint = "https://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.r2.cloudflarestorage.com"
r2_access_key_id_path = "/tmp/fake-coquic-home/private/credentials/r2-access-key-id"
r2_secret_access_key_path = "/tmp/fake-coquic-home/private/credentials/r2-secret-access-key"
public_bucket = "coquic-public-example"
private_bucket = "coquic-private-example"
public_base_url = "https://objects.example.test/coquic/"
staging_root = "/tmp/fake-coquic-home/private/publication-staging"
network_timeout_seconds = 30
lease_duration_seconds = 300
max_retries = 3
retry_backoff_seconds = 5

# Docker Compose deployment is opt-in. Production must uncomment every path,
# numeric identity, credential file, image ID, and resource threshold; these
# values are deliberately fake examples and never contain secret values.
[steward.deployment]
enabled = false
# home = "/srv/coquic-steward"
# repository = "/srv/coquic-steward/repository"
docker_socket = "/var/run/docker.sock"
# host_uid = 1000
# host_gid = 1000
# docker_gid = 999
expected_remote = "origin"
expected_branch = "main"
compose_project = "coquic-steward"
# codex_credential_path = "/run/secrets/codex-api-key"
# github_token_path = "/run/secrets/github-token"
# git_ssh_key_path = "/run/secrets/git-ssh-key"
# git_known_hosts_path = "/etc/coquic-steward/known_hosts"
# release_id = "release-example"
# daemon_image_id = "sha256:<64 lowercase hex characters>"
# task_image_id = "sha256:<64 lowercase hex characters>"
stop_grace_seconds = 45
max_pids = 512
max_memory_bytes = 4294967296
max_log_bytes = 67108864
max_scratch_bytes = 8589934592
# Production has no implicit pressure defaults. The following fake values are
# intentionally commented until an operator chooses machine-specific limits.
# min_free_bytes = 1073741824
# max_owned_docker_bytes = 4294967296
# recovery_free_bytes = 2147483648
# recovery_owned_docker_bytes = 3221225472

# Usage telemetry is observational. Codex exec exposes turns, not upstream
# requests, billing, TTFT, or token streaming rates. Leave billing_mode=unknown
# unless an operator deliberately selects API billing with exact model and
# effective-date coverage in the committed steward/model-prices.json catalog.
# Never put credentials in a catalog.
# [steward.telemetry]
# billing_mode = "unknown" # unknown, chatgpt, or api

# Steward owns the raw task and control-loop archive peers below COQUIC_HOME.
# Their roots are immutable-by-placement research data. Transfer is configured
# separately by the dataset transport boundary and is intentionally absent
# from this example.

# Stage settings override the global model/reasoning settings above. Omitted
# values fall back independently to codex_model and codex_reasoning_effort.
[steward.codex.signal_planner]
# model = "gpt-5.6-terra"
# reasoning_effort = "medium"

[steward.codex.implementation_plan]
# model = "gpt-5.6-terra"
# reasoning_effort = "high"

[steward.codex.code]
# model = "gpt-5.6-terra"
# reasoning_effort = "high"

[steward.codex.review]
# model = "gpt-5.6-terra"
# reasoning_effort = "medium"

# Compatibility-only: the durable pipeline now uses deterministic commit wording.
[steward.codex.commit_message]
# model = "gpt-5.6-terra"
# reasoning_effort = "low"

[steward.signals]
enabled = [
  "github-actions:ci",
  "github-actions:test",
  "github-actions:duvet",
  "github-actions:nightly-ci",
  "github-actions:deploy-demo",
  "github-actions:interop",
  "github-actions:perf",
  "github-issues:features",
  "code-scanning",
  "codacy",
]

[steward.limits]
max_active_tasks = 4
max_main_pushes_per_day = 10
plan_timeout_minutes = 30
worker_timeout_minutes = 120
review_timeout_minutes = 20
validation_timeout_minutes = 30

[steward.path_policy]
# Frozen paths are repository-relative. Matching patches are blocked before
# validation/review, and the active policy is included in worker prompts.
frozen = [
  ".coquic-steward/**",
  ".remote-ci/**",
  ".rag/**",
  ".github/**",
  ".clang-tidy",
  ".pre-commit-config.yaml",
  "flake.nix",
  "flake.lock",
  "scripts/run-clang-tidy.sh",
  "scripts/run-validation-with-index.sh",
]

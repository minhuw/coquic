[steward]
# The daemon checks SQLite for CLI wakeups at this interval. Signal polling
# intervals are configured per provider below.
scheduler_wait_interval_sec = 1.0
codex_bin = "codex"
# codex_model = "gpt-5.6-terra"
# codex_reasoning_effort = "medium"
codex_sandbox = "workspace-write"
# The daemon resolves and locks these digests before constructing a task
# container. Never put credentials or a mutable tag in runtime state.
task_image = "coquic-steward-task"
# task_image_digest = "sha256:<64 lowercase hex characters>"
daemon_image = "coquic-steward-daemon"
# daemon_image_digest = "sha256:<64 lowercase hex characters>"
runtime_protocol = "task-container-v1"
integration_mode = "local-only"
local_only = false
shutdown_grace_seconds = 30
# Resume launch attempts are deliberately fixed at two; ordinary role changes
# always allocate a fresh session.
resume_attempt_limit = 2
git_remote = "origin"
main_branch = "main"
github_repository = "minhuw/coquic"

# Task containers are disabled by default for local planning fixtures. When
# enabled, every path is host-local and the image must be locked by digest.
[steward.container]
enabled = false
image = "coquic-steward-task"
# image_digest = "sha256:<64 lowercase hex characters>"
# repository_host_path = "/srv/coquic"
# state_host_path = "/srv/coquic-steward"
# codex_api_key_path = "/run/secrets/codex-api-key"
docker_bin = "docker"
network = "bridge"

# Raw task synchronization is daemon-only and is opt-in. Credentials are file
# paths, never inline values; preflight rejects missing or unsafe files.
[steward.task_sync]
enabled = false
# remote_user = "archive"
# remote_host = "receiver.example.test"
# remote_port = 22
# identity_path = "/run/secrets/task-sync-key"
# known_hosts_path = "/etc/coquic/known_hosts"
ssh_bin = "ssh" # resolved to an absolute locked path when configuration loads
rsync_bin = "rsync" # must match the executable selected by PATH
# connect_timeout_seconds = 10
# transfer_timeout_seconds = 300

# Usage telemetry is observational. Codex exec exposes turns, not upstream
# requests, billing, TTFT, or token streaming rates. Leave billing_mode=unknown
# unless an operator deliberately selects an API catalog with exact model and
# effective-date coverage. Never put credentials in a catalog.
# [steward.telemetry]
# billing_mode = "unknown" # unknown, chatgpt, or api
# price_catalog_path = "model-prices.example.json" # fictional example only

# The daemon writes a sanitized v3 snapshot locally and publishes it to the
# read-only site with an atomic SSH/rsync mirror. Keep transcript_mode=redacted
# for any public target; raw transcripts are rejected when publish=true.
[steward.public_mirror]
enabled = true
publish = false
output_path = "public/steward/status.json"
transcript_mode = "redacted"
remote_user = "minhuw"
remote_host = "coquic.minhuw.dev"
remote_port = 22
remote_path = "/opt/coquic-demo/current/app/public/steward/status.json"
ssh_key_path = "~/.ssh/coquic-demo.key"
known_hosts_path = "~/.ssh/known_hosts"
connect_timeout_seconds = 10
retry_initial_seconds = 30
retry_max_seconds = 300

# Stage settings override the global model/reasoning settings above. Omitted
# values fall back independently to codex_model and codex_reasoning_effort.
[steward.codex.signal_planner]
# model = "gpt-5.6-terra"
# reasoning_effort = "medium"

[steward.codex.implementation_plan]
# model = "gpt-5.6-terra"
# reasoning_effort = "high"

[steward.codex.code]
# model = "gpt-5.6-terra"
# reasoning_effort = "high"

[steward.codex.review]
# model = "gpt-5.6-terra"
# reasoning_effort = "medium"

[steward.codex.commit_message]
# model = "gpt-5.6-terra"
# reasoning_effort = "low"

[steward.signals]
enabled = [
  "github-actions:ci",
  "github-actions:test",
  "github-actions:duvet",
  "github-actions:nightly-ci",
  "github-actions:deploy-demo",
  "github-actions:interop",
  "github-actions:perf",
  "github-issues:features",
  "code-scanning",
  "codacy",
]

[steward.limits]
max_active_tasks = 4
max_main_pushes_per_day = 10
plan_timeout_minutes = 30
worker_timeout_minutes = 120
review_timeout_minutes = 20
validation_timeout_minutes = 30

[steward.path_policy]
# Frozen paths are repository-relative. Matching patches are blocked before
# validation/review, and the active policy is included in worker prompts.
frozen = [
  ".coquic-steward/**",
  ".remote-ci/**",
  ".rag/**",
  ".github/**",
  ".clang-tidy",
  ".pre-commit-config.yaml",
  "flake.nix",
  "flake.lock",
  "scripts/run-clang-tidy.sh",
  "scripts/run-validation-with-index.sh",
]
